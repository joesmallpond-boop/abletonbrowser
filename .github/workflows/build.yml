name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/publish.yml", "README.md"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSB_BUILD_PLUGIN=OFF
      - name: Build tests
        run: cmake --build build --target AnalyzerTests EngineTests -j4
      - name: Run analysis tests
        run: ./build/AnalyzerTests_artefacts/Release/AnalyzerTests
      - name: Run engine tests
        run: ./build/EngineTests_artefacts/Release/EngineTests

  macos:
    # GitHub's Mac machines are often at capacity: ask for both kinds; each builds the same universal
    # installer and whichever finishes publishes it.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DSB_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target BashBrowser_VST3 BashBrowser_AU BashBrowser_Standalone -- -quiet
      - name: Package installer
        run: |
          set -e
          ART="build/BashBrowser_artefacts/Release"
          ls -R "$ART" | head -50
          STAGE=pkgroot
          mkdir -p "$STAGE/vst3" "$STAGE/au" "$STAGE/app"
          cp -R "$ART/VST3/Bash Browser.vst3" "$STAGE/vst3/"
          cp -R "$ART/AU/Bash Browser.component" "$STAGE/au/"
          cp -R "$ART/Standalone/Bash Browser.app" "$STAGE/app/"
          # ad-hoc sign so Apple Silicon will load the binaries
          codesign --force --deep -s - "$STAGE/vst3/Bash Browser.vst3"
          codesign --force --deep -s - "$STAGE/au/Bash Browser.component"
          codesign --force --deep -s - "$STAGE/app/Bash Browser.app"
          # The VST3, AU and app share one bundle ID. Component packages are "relocatable" by default,
          # so the installer would redirect the plugins onto the already-installed app. Turn that off.
          for part in vst3 au app; do
            pkgbuild --analyze --root "$STAGE/$part" "$part.plist"
            /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" "$part.plist"
          done
          pkgbuild --root "$STAGE/vst3" --component-plist vst3.plist --identifier com.kalabash.bashbrowser.vst3 --version 0.1.1 \
                   --install-location "/Library/Audio/Plug-Ins/VST3" vst3.pkg
          pkgbuild --root "$STAGE/au" --component-plist au.plist --identifier com.kalabash.bashbrowser.au --version 0.1.1 \
                   --install-location "/Library/Audio/Plug-Ins/Components" au.pkg
          pkgbuild --root "$STAGE/app" --component-plist app.plist --identifier com.kalabash.bashbrowser.app --version 0.1.1 \
                   --install-location "/Applications" app.pkg
          # check the payloads land in the right folders
          for p in vst3 au app; do pkgutil --payload-files $p.pkg | head -3; done
          productbuild --package vst3.pkg --package au.pkg --package app.pkg "Bash Browser Installer.pkg"
          mkdir dmg
          cp "Bash Browser Installer.pkg" dmg/
          cp README.md dmg/"Read Me.md"
          hdiutil create -volname "Bash Browser" -srcfolder dmg -ov -format UDZO "Bash-Browser-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Bash-Browser-mac-${{ matrix.runner }}
          path: Bash-Browser-mac.dmg
      - name: Publish as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Bash Browser (latest build)" \
            --notes "Mac installer for Bash Browser by Kalabash. Open the DMG and run Bash Browser Installer.pkg (right-click > Open the first time)."
          gh release upload latest Bash-Browser-mac.dmg --clobber
          gh release edit latest --notes "Mac installer for Bash Browser by Kalabash, built from ${GITHUB_SHA::7}. Open the DMG and run Bash Browser Installer.pkg (right-click > Open the first time)."
